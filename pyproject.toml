[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indexcheck"
version = "0.1.0"
description = "Check a book index against FSG house style, marking fixes as tracked changes in the Word file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.2",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
indexcheck = "indexcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
