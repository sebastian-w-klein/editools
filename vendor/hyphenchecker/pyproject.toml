[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyphencheck"
version = "1.0.0"
description = "Audit end-of-line hyphen breaks in a typeset book proof against a nine-rule house style."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "requests>=2.28",
    "pyphen>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "reportlab>=4"]

[project.scripts]
hyphencheck = "hyphencheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
